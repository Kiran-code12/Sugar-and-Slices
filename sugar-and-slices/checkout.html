<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delivery Details – Sugar and Slices</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="checkout">

  <div id="site-nav"></div>

  <div class="page-head">
    <h1>Delivery Details 🚚</h1>
    <p>Tell us where and when you'd like your treats.</p>
  </div>
  <section class="section" style="padding-top:30px">
    <div id="checkoutWrap" class="checkout-grid">
      <form class="panel" id="deliveryForm">
        <h3 class="ptitle">Your Details</h3>
        <div class="two">
          <div><label for="fullname">Full name</label><input id="fullname" name="fullname" required placeholder="Your name"></div>
          <div><label for="phone">Phone number</label><input id="phone" name="phone" required pattern="[0-9]{10}" maxlength="10" inputmode="numeric" placeholder="10-digit mobile number"></div>
        </div>
        <label for="email">Email (optional)</label><input id="email" name="email" type="email" placeholder="you@example.com">

        <h3 class="ptitle" style="margin-top:28px">Delivery Method</h3>
        <div class="choice">
          <label><input type="radio" name="dtype" value="delivery" checked>🏠 Home delivery</label>
          <label><input type="radio" name="dtype" value="pickup">🏪 Store pickup (free)</label>
        </div>

        <div id="addressFields">
          <label for="address">Delivery address</label><textarea id="address" name="address" style="height:90px" placeholder="House no., street, landmark"></textarea>
          <div class="two">
            <div><label for="city">City</label><input id="city" name="city" value="Jalandhar"></div>
            <div><label for="pincode">Pincode</label><input id="pincode" name="pincode" pattern="[0-9]{6}" maxlength="6" inputmode="numeric" placeholder="6 digits"></div>
          </div>
        </div>

        <div class="two">
          <div><label for="date">Date</label><input id="date" name="date" type="date" required></div>
          <div><label for="slot">Time slot</label>
            <select id="slot" name="slot"><option>9:00 AM – 12:00 PM</option><option>12:00 PM – 3:00 PM</option><option>3:00 PM – 6:00 PM</option><option>6:00 PM – 9:00 PM</option></select></div>
        </div>

        <h3 class="ptitle" style="margin-top:28px">Payment</h3>
        <div class="choice">
          <label><input type="radio" name="pay" value="Cash on Delivery" checked>💵 Cash on delivery</label>
          <label><input type="radio" name="pay" value="UPI on Delivery">📱 UPI on delivery</label>
        </div>

        <button class="btn block" style="margin-top:28px" type="submit">Place Order</button>
        <p class="note">Cakes need at least one day's notice, so the earliest date is tomorrow.</p>
      </form>

      <aside class="panel summary" id="summary"></aside>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="js/site.js"></script>
</body>
</html>
